name: Atualizar referências visuais
# Roda só quando chamado à mão: tira as capturas no mesmo ambiente dos testes e grava como nova referência.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepara o navegador de testes
        run: |
          pip install -q playwright==1.48.0 pillow
          python -m playwright install --with-deps chromium > /dev/null
      - name: Tira as capturas
        run: python tools/tests/run.py || true
      - name: Grava como referência
        run: |
          cp tools/tests/visual/atual/*.png tools/tests/visual/base/
          git config user.name "escala-b6-bot"
          git config user.email "actions@users.noreply.github.com"
          git add tools/tests/visual/base
          git diff --cached --quiet && exit 0
          git commit -m "Atualiza referências visuais (ambiente de testes)"
          git pull --rebase -X theirs origin main && git push
