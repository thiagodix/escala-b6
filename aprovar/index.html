<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:; connect-src https://hofrthndlstofytlapzk.supabase.co; base-uri 'none'; form-action 'none'">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#000000">
<title>Aprovação de repertório · Fervor</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:#000;color:#fff;font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
.w{max-width:560px;margin:0 auto;padding:18px 16px calc(210px + env(safe-area-inset-bottom))}
.br{color:#00CDD3;font-weight:700;font-size:.78rem;letter-spacing:.08em;text-transform:uppercase}
h1{font-size:1.65rem;line-height:1.15;margin:6px 0 4px}
.sub{color:#A6A6AD;font-size:.95rem}
.pv{margin-top:8px;color:#D1D1D6;font-size:.95rem}
.box{border-radius:14px;padding:12px 14px;margin:14px 0;background:#1C1C1E;border:1px solid #2C2C2E}
.box.ch{background:#1a160b;border-color:#4a3d12}.box.ch b{color:#FFD60A}
.box.ok{background:#0A2230;border-color:#0D3A48}.box.ok b{color:#30D158}
.box.aj{background:#1a160b;border-color:#4a3d12}.box.aj b{color:#FFD60A}
.box ul{margin:6px 0 0;padding-left:18px;color:#D1D1D6;font-size:.92rem}
.box p{margin:6px 0 0;color:#D1D1D6;font-size:.92rem;white-space:pre-wrap}
.box button.l{background:none;border:0;color:#00CDD3;font:inherit;font-weight:600;padding:8px 0 0;cursor:pointer}
ol{list-style:none;margin:16px 0 0;padding:0}
li.s{display:flex;gap:12px;align-items:flex-start;background:#1C1C1E;border:1px solid #2C2C2E;border-radius:14px;padding:12px;margin-bottom:8px}
li.s .n{flex:none;min-width:28px;height:28px;border-radius:14px;background:#2C2C2E;color:#00CDD3;font-weight:700;font-size:.8rem;display:flex;align-items:center;justify-content:center;padding:0 6px}
li.s .t{flex:1;min-width:0}
li.s b{display:block;font-size:1.02rem;line-height:1.25;overflow-wrap:anywhere}
li.s .m{display:block;color:#D1D1D6;font-size:.9rem;margin-top:1px}
li.s .i{display:block;color:#A6A6AD;font-size:.84rem;margin-top:3px}
li.s .k{flex:none;background:#fff;color:#000;font-weight:800;border-radius:8px;padding:3px 9px;font-size:.95rem}
li.s a.o{display:inline-block;margin-top:6px;color:#00CDD3;font-size:.88rem;font-weight:600;text-decoration:none}
li.s.sel{border-color:#FFD60A;background:#1a160b}
.tg{display:none;flex:none;align-self:center;font-size:.8rem;font-weight:700;border-radius:999px;border:1.5px solid #636366;color:#D1D1D6;padding:6px 10px;background:none}
.ed li.s{cursor:pointer}.ed .tg{display:block}.ed li.s.sel .tg{border-color:#FFD60A;color:#000;background:#FFD60A}
.pp{margin-top:12px;color:#A6A6AD;font-size:.9rem}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(0,0,0,.94);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid #2C2C2E;padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto}
.nm{display:flex;align-items:center;gap:8px;margin-bottom:10px;color:#A6A6AD;font-size:.88rem}
.nm input{flex:1;min-width:0;background:#1C1C1E;border:1px solid #3A3A3C;border-radius:10px;color:#fff;font:inherit;padding:10px 12px}
.nm button{background:none;border:0;color:#00CDD3;font:inherit;font-weight:600;cursor:pointer;padding:6px}
.row{display:flex;gap:10px}
.b{flex:1;border:0;border-radius:14px;font:inherit;font-weight:700;padding:15px 10px;cursor:pointer;font-size:1.02rem}
.b.p{background:#00CDD3;color:#00181A}.b.g{background:#2C2C2E;color:#fff}.b:disabled{opacity:.5}
textarea{width:100%;min-height:92px;background:#1C1C1E;border:1px solid #3A3A3C;border-radius:12px;color:#fff;font:inherit;padding:12px;resize:vertical;margin:0 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.chips button{background:#1C1C1E;border:1px solid #3A3A3C;color:#D1D1D6;border-radius:999px;padding:6px 11px;font:inherit;font-size:.84rem;cursor:pointer}
.er{color:#FF453A;font-size:.9rem;margin:0 0 8px}
.c{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:10px;padding:24px}
.c .ck{width:72px;height:72px;border-radius:36px;background:#0A2230;border:2px solid #00CDD3;display:flex;align-items:center;justify-content:center;font-size:2.2rem;color:#00CDD3}
.c h2{margin:6px 0 0;font-size:1.4rem}.c p{margin:0;color:#A6A6AD;max-width:320px}
.c button{margin-top:10px;background:none;border:0;color:#00CDD3;font:inherit;font-weight:600;cursor:pointer;padding:10px}
</style></head><body>
<div id="app"><div class="c"><p>Carregando…</p></div></div>
<script>
(function(){
var SBR='https://hofrthndlstofytlapzk.supabase.co/rest/v1/rpc/',SBK='sb_publishable_Hmstttzx95SEN24Olsuk0g_AuPGnkX7';
var T=(new URLSearchParams(location.search).get('t')||'').trim(),app=document.getElementById('app');
var D=null,mode='ver',sel={},nome='';
try{nome=localStorage.getItem('apv.nome')||''}catch(e){}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function rpc(n,b){return fetch(SBR+n,{method:'POST',headers:{apikey:SBK,'Content-Type':'application/json'},body:JSON.stringify(b)}).then(function(r){return r.json().catch(function(){return null}).then(function(j){if(!r.ok)throw new Error((j&&(j.message||j.hint))||'Sem conexão. Tente de novo.');return j})})}
function fdt(t){try{return new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}catch(e){return''}}
function bad(m){app.innerHTML='<div class="c"><h2>'+esc(m||'Link indisponível')+'</h2><p>Peça à liderança da banda para enviar o link de novo.</p></div>'}
function load(){
 if(!/^[0-9a-f]{32}$/.test(T))return bad();
 rpc('apv_ver',{p_token:T}).then(function(j){if(!j||!j.ok)return bad();D=j;draw()}).catch(function(e){bad('Sem conexão')})}
function draw(){
 var c=D.culto||{},ms=c.musicas||[],r=D.resposta,h='';
 h+='<div class="w'+(mode=='aj'?' ed':'')+'"><div class="br">Fervor · Aprovação de repertório</div><h1>'+esc(c.titulo||'Repertório')+'</h1>';
 var sb=[c.nome,c.data_txt].filter(Boolean).join(' · ');if(sb)h+='<div class="sub">'+esc(sb)+'</div>';
 if(c.pregador)h+='<div class="pv">Pregador(a): '+esc(c.pregador)+'</div>';
 if(D.versao>1&&c.mudancas)h+='<div class="box ch"><b>O que mudou desde a última versão</b><p>'+esc(c.mudancas)+'</p></div>';
 if(r&&D.status!='aguardando'&&mode=='ver'){
  if(r.evento=='aprovado')h+='<div class="box ok"><b>✓ Aprovado'+(r.por?' por '+esc(r.por):'')+'</b><p>'+esc(fdt(r.em))+'</p><button class="l" id="mud">Mudar resposta</button></div>';
  else h+='<div class="box aj"><b>Sugestão enviada'+(r.por?' por '+esc(r.por):'')+'</b><p>'+esc(fdt(r.em))+(r.nota?'\n'+esc(r.nota):'')+'</p><button class="l" id="mud">Mudar resposta</button></div>'}
 h+='<ol>';
 ms.forEach(function(m,i){
  var on=sel[i]?' sel':'';
  h+='<li class="s'+on+'" data-i="'+i+'"><span class="n">'+esc(m.p||(i+1)+'.')+'</span><div class="t"><b>'+esc(m.t)+'</b>'+((m.m&&m.m.length)?'<span class="m">+ '+esc(m.m.join(' + '))+'</span>':'')+(m.c?'<span class="i">'+esc(m.c)+'</span>':'')+(m.l?'<a class="o" target="_blank" rel="noopener noreferrer" href="'+esc(m.l)+'">▶ Ouvir</a>':'')+'</div>'+(m.k?'<span class="k">'+esc(m.k)+'</span>':'')+'<button type="button" class="tg">'+(sel[i]?'Trocar ✓':'Trocar')+'</button></li>'});
 h+='</ol>';
 if(!ms.length)h+='<div class="box"><p>Este repertório ainda não tem músicas.</p></div>';
 if(c.pp&&c.pp.length)h+='<div class="pp">Possíveis pós-palavra: '+c.pp.map(esc).join(', ')+'</div>';
 h+='</div><div class="bar"><div class="in">';
 var er='<p class="er" id="er" hidden></p>';
 if(mode=='aj'){
  h+=er+'<textarea id="nt" placeholder="O que você sugere? (pode marcar músicas acima em “Trocar”)"></textarea><div class="chips"><button type="button" data-q="Trocar a música ">Trocar música</button><button type="button" data-q="Mudar a ordem: ">Mudar ordem</button><button type="button" data-q="Mudar o tom de ">Mudar tom</button><button type="button" data-q="Falta uma música sobre ">Falta música</button></div>'}
 else h+=er;
 h+=nameRow();
 if(mode=='aj')h+='<div class="row"><button class="b g" id="vol">Voltar</button><button class="b p" id="env">Enviar sugestão</button></div>';
 else h+='<div class="row"><button class="b g" id="saj">Sugerir alteração</button><button class="b p" id="apr">✓ Aprovar</button></div>';
 h+='</div></div>';
 app.innerHTML=h;bind()}
function nameRow(){return nome?'<div class="nm"><span>Respondendo como <b style="color:#fff">'+esc(nome)+'</b></span><button id="trn" type="button">trocar</button></div>':'<div class="nm"><input id="nmi" placeholder="Seu nome" maxlength="60" autocomplete="name"></div>'}
function $(i){return document.getElementById(i)}
function err(m){var e=$('er');if(e){e.textContent=m;e.hidden=false}}
function getNome(){if(nome)return nome;var i=$('nmi'),v=i?i.value.trim():'';if(!v){err('Escreva seu nome para responder.');if(i)i.focus();return''}nome=v;try{localStorage.setItem('apv.nome',v)}catch(e){}return v}
function bind(){
 var mu=$('mud');if(mu)mu.onclick=function(){D.status='aguardando';draw()};
 var tn=$('trn');if(tn)tn.onclick=function(){nome='';try{localStorage.removeItem('apv.nome')}catch(e){}draw();var i=$('nmi');if(i)i.focus()};
 var a=$('apr');if(a)a.onclick=function(){var n=getNome();if(!n)return;a.disabled=true;send('aprovado',n,'',[])};
 var s=$('saj');if(s)s.onclick=function(){mode='aj';draw();scrollTo(0,0)};
 var v=$('vol');if(v)v.onclick=function(){mode='ver';sel={};draw()};
 var e=$('env');if(e)e.onclick=function(){var n=getNome();if(!n)return;var nt=($('nt').value||'').trim(),it=[];(D.culto.musicas||[]).forEach(function(m,i){if(sel[i])it.push(m.t)});if(!nt&&!it.length){err('Escreva o que sugere ou marque uma música em “Trocar”.');return}e.disabled=true;send('ajuste',n,nt,it)};
 Array.prototype.forEach.call(document.querySelectorAll('.chips button'),function(b){b.onclick=function(){var t=$('nt');t.value=(t.value?t.value+'\n':'')+b.getAttribute('data-q');t.focus()}});
 if(mode=='aj')Array.prototype.forEach.call(document.querySelectorAll('li.s'),function(li){li.onclick=function(ev){if(ev.target.closest&&ev.target.closest('a'))return;var i=+li.getAttribute('data-i');sel[i]=!sel[i];li.className='s'+(sel[i]?' sel':'');li.querySelector('.tg').textContent=sel[i]?'Trocar ✓':'Trocar'}})}
function send(ac,n,nt,it){
 rpc('apv_responder',{p_token:T,p_acao:ac,p_nome:n,p_nota:nt,p_itens:it}).then(function(){done(ac)}).catch(function(e){var b=$('apr')||$('env');if(b)b.disabled=false;err(String(e.message||e).replace(/^.*?:\s*/,''))})}
function done(ac){
 app.innerHTML='<div class="c"><div class="ck">✓</div><h2>'+(ac=='aprovado'?'Repertório aprovado':'Sugestão enviada')+'</h2><p>A liderança da banda já foi avisada. Obrigado!</p><button id="again">Mudar resposta</button></div>';
 $('again').onclick=function(){mode='ver';sel={};load()}}
load();
})();
</script></body></html>
